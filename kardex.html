<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mi Kardex Escolar</title>
    <style>
        /* --- PALETA DE COLORES CYBERPUNK/NEÓN --- */
        :root {
            --bg-dark: #0b0f19;
            --card-default: rgba(30, 41, 59, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --passed-color: #4c1d95;
            --passed-text: #ffffff;
            --cyan-progress: #00e6ff;
            --text-muted: rgba(255, 255, 255, 0.6);
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: var(--bg-dark) url('image_1.png') no-repeat center center fixed; 
            background-size: cover; 
            padding: 12px; 
            margin: 0; 
            color: #ffffff;
            -webkit-tap-highlight-color: transparent; /* Quita el destello molesto al tocar en Android */
        }

        /* --- ENCABEZADO OPTIMIZADO PARA MÓVIL --- */
        header { 
            background: rgba(15, 23, 42, 0.65); 
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 12px; 
            border-radius: 12px; 
            margin-bottom: 15px; 
            display: flex; 
            flex-direction: column; /* Apilado en móvil para mejor espacio */
            gap: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }
        
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        header h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.5px; }

        /* --- RETÍCULA EN VERTICAL PARA ANDROID --- */
        .grid-reticula { 
            display: flex;
            flex-direction: column; /* Lista vertical ideal para scrollear con el pulgar */
            gap: 15px; 
        }
        
        .semestre-col { 
            background: rgba(15, 23, 42, 0.55); 
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border-radius: 10px; 
            overflow: hidden; 
            border: 1px solid var(--card-border);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        
        .semestre-header { 
            background: rgba(0, 0, 0, 0.4); 
            color: white; 
            text-align: center; 
            padding: 8px; 
            font-weight: bold; 
            font-size: 13px; 
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--card-border);
        }
        
        /* --- MATERIAS MEJORADAS PARA EL TACTO --- */
        .materia-card { 
            background: var(--card-default);
            border: 1px solid var(--card-border); 
            padding: 12px; 
            position: relative; 
            margin: 8px; 
            border-radius: 6px; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            height: 90px; /* Un poco más alta para evitar toques fantasma */
            box-sizing: border-box;
            user-select: none; /* Evita que se seleccione texto al mantener pulsado */
            -webkit-user-select: none;
            transition: background-color 0.2s;
        }
        
        /* --- MATERIA APROBADA CON BORDE ANIMADO --- */
        .materia-card.aprobada { 
            background-color: var(--passed-color); 
            color: var(--passed-text); 
            border: 2px solid transparent;
            background-image: linear-gradient(var(--passed-color), var(--passed-color)), linear-gradient(90deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,1) 50%, rgba(255,255,255,0.1) 100%);
            background-size: 100% 100%, 200% 100%;
            background-origin: border-box;
            background-clip: padding-box, border-box;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.25);
            animation: bovedaBrillo 3s linear infinite;
        }

        @keyframes bovedaBrillo {
            0% { background-position: 0% 0%, 0% 0%; }
            100% { background-position: 0% 0%, -200% 0%; }
        }
        
        .materia-header { font-size: 10px; font-weight: bold; color: var(--text-muted); margin-right: 25px; }
        .materia-card.aprobada .materia-header { color: rgba(255,255,255,0.6); }
        
        .materia-name { font-size: 12px; font-weight: bold; text-transform: uppercase; line-height: 1.2; flex-grow: 1; margin-top: 4px; overflow: hidden; }
        .materia-creditos { font-size: 10px; font-weight: 800; color: var(--text-muted); align-self: flex-end; }
        .materia-card.aprobada .materia-creditos { color: #ffffff; }
        
        /* Botón Desbloquear más grande para el pulgar */
        .btn-desbloquear { 
            position: absolute; top: 6px; right: 6px; 
            display: none; font-size: 14px; 
            background: rgba(255, 255, 255, 0.25); 
            border: 1px solid rgba(255, 255, 255, 0.4); 
            color: #fff;
            cursor: pointer; border-radius: 4px; z-index: 10; 
            padding: 4px 6px;
        }
        .materia-card.aprobada .btn-desbloquear { display: block; }
        
        /* --- ESTADÍSTICAS --- */
        .stats { font-weight: bold; font-size: 13px; display: flex; justify-content: space-between; align-items: center; width: 100%; }
        #porc { color: var(--cyan-progress); font-size: 15px; }
        .progress-bar { flex-grow: 1; max-width: 140px; height: 10px; background: rgba(255, 255, 255, 0.1); border-radius: 5px; overflow: hidden; margin-left: 8px; border: 1px solid rgba(255,255,255,0.05); }
        .fill { height: 100%; background: var(--cyan-progress); width: 0%; transition: width 0.5s ease; box-shadow: 0 0 8px var(--cyan-progress); }

        /* --- PANTALLA DE CARGA --- */
        #loading-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000000; color: #fff; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999;
            transition: opacity 0.6s ease, visibility 0.6s;
        }
