<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mi Kardex Escolar</title>
    <style>
        /* --- PALETA DE COLORES CYBERPUNK/NEÓN --- */
        :root {
            --bg-dark: #0b0f19;
            --card-default: rgba(30, 41, 59, 0.85);
            --card-border: rgba(255, 255, 255, 0.1);
            --passed-color: #4c1d95;
            --passed-text: #ffffff;
            --cyan-progress: #00e6ff;
            --text-muted: rgba(255, 255, 255, 0.6);
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            /* Se asegura un color oscuro de fondo sólido por si no encuentra image_1.png */
            background-color: var(--bg-dark);
            background-image: url('image_1.png');
            background-repeat: no-repeat;
            background-position: center center;
            background-attachment: fixed;
            background-size: cover; 
            padding: 15px; 
            margin: 0; 
            color: #ffffff;
            -webkit-tap-highlight-color: transparent;
        }

        /* --- ENCABEZADO --- */
        header { 
            background: rgba(15, 23, 42, 0.85); 
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 15px; 
            border-radius: 12px; 
            margin-bottom: 20px; 
            display: flex; 
            flex-direction: column;
            gap: 10px;
            border: 1px solid var(--card-border);
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.5);
        }
        
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        header h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.5px; color: #fff; }

        /* --- RETÍCULA VERTICAL --- */
        .grid-reticula { 
            display: flex;
            flex-direction: column;
            gap: 15px; 
        }
        
        .semestre-col { 
            background: rgba(15, 23, 42, 0.7); 
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border-radius: 10px; 
            overflow: hidden; 
            border: 1px solid var(--card-border);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }
        
        .semestre-header { 
            background: rgba(0, 0, 0, 0.5); 
            color: #fff; 
            text-align: center; 
            padding: 10px; 
            font-weight: bold; 
            font-size: 14px; 
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--card-border);
        }
        
        /* --- TARJETAS DE MATERIA --- */
        .materia-card { 
            background: var(--card-default);
            border: 1px solid var(--card-border); 
            padding: 14px; 
            position: relative; 
            margin: 10px; 
            border-radius: 8px; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            min-height: 95px;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        
        .materia-card.aprobada { 
            background-color: var(--passed-color) !important; 
            color: var(--passed-text); 
            border: 2px solid transparent;
            background-image: linear-gradient(var(--passed-color), var(--passed-color)), linear-gradient(90deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,1) 50%, rgba(255,255,255,0.1) 100%);
            background-size: 100% 100%, 200% 100%;
            background-origin: border-box;
            background-clip: padding-box, border-box;
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.5);
            animation: bovedaBrillo 3s linear infinite;
        }

        @keyframes bovedaBrillo {
            0% { background-position: 0% 0%, 0% 0%; }
            100% { background-position: 0% 0%, -200% 0%; }
        }
        
        .materia-header { font-size: 11px; font-weight: bold; color: var(--text-muted); }
        .materia-name { font-size: 13px; font-weight: bold; text-transform: uppercase; line-height: 1.3; margin-top: 6px; flex-grow: 1; color: #fff; }
        .materia-creditos { font-size: 11px; font-weight: 800; color: var(--cyan-progress); align-self: flex-end; margin-top: 4px; }
        
        .btn-desbloquear { 
            position: absolute; top: 8px; right: 8px; 
            display: none; font-size: 14px; 
            background: rgba(255, 255, 255, 0.2); 
            border: 1px solid rgba(255, 255, 255, 0.4); 
            color: #fff;
            cursor: pointer; border-radius: 4px; padding: 4px 6px; z-index: 10;
        }
        .materia-card.aprobada .btn-desbloquear { display: block; }
        
        /* --- PROGRESO --- */
        .stats { font-weight: bold; font-size: 14px; display: flex; justify-content: space-between; align-items: center; width: 100%; }
        #porc { color: var(--cyan-progress); font-size: 16px; }
        .progress-bar { flex-grow: 1; max-width: 150px; height: 12px; background: rgba(255, 255, 255, 0.1); border-radius: 6px; overflow: hidden; margin-left: 10px; border: 1px solid rgba(255,255,255,0.05); }
        .fill { height: 100%; background: var(--cyan-progress); width: 0%; transition: width 0.5s ease; box-shadow: 0 0 10px var(--cyan-progress); }

        /* --- PANTALLA DE CARGA MEJORADA --- */
        #loading-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #0b0f19; color: #fff; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999;
        }
        .bouquet-container { display: flex; justify-content: center; align-items: flex-end; height: 100px; margin-bottom: 20px; }
        .rose { font-size: 40px; animation: pulseRose 1.5s infinite alternate; }
        @keyframes pulseRose { from { transform: scale(0.9); } to { transform: scale(1.1); } }
        #loading-text { font-size: 18px; font-weight: bold; color: var(--cyan-progress); text-align: center; width: 80%; }

        /* --- MODALES --- */
        .universal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.85); display: none; justify-content: center;
            align-items: center; z-index: 9000; backdrop-filter: blur(6px); padding: 20px; box-sizing: border-box;
        }
        .custom-modal {
            background: #0f172a; padding: 25px; border-radius: 16px; text-align: center; max-width: 400px; width: 100%;
            border: 2px solid var(--cyan-progress); box-shadow: 0 0 20px var(--cyan-progress);
        }
        .custom-modal h2 { margin: 0 0 10px 0; color: var(--cyan-progress); font-size: 22px; }
        .custom-modal p { color: #fff; font-size: 15px; line-height: 1.4; margin-bottom: 20px; }
        .btn-modal { background: var(--cyan-progress); color: #000; border: none; padding: 12px; font-size: 14px; font-weight: bold; border-radius: 6px; width: 100%; cursor: pointer; text-transform: uppercase; }
    </style>
</head>
<body>

<!-- Pantalla de carga simplificada para evitar bloqueos prolongados -->
<div id="loading-screen">
    <div class="bouquet-container">
        <span class="rose">🌹💐🌹</span>
    </div>
    <div id="loading-text">Iniciando tu Kardex...</div>
</div>

<div id="universal-overlay-container" class="universal-overlay">
    <div class="custom-modal">
        <h2 id="modal-title">Logro obtenido</h2>
        <p id="modal-text">Mensaje</p>
        <button class="btn-modal" onclick="cerrarModal()">Continuar</button>
    </div>
</div>

<header>
    <div class="header-top">
        <h1>Mi Kardex</h1>
        <div style="font-weight: bold; font-size: 14px;">Créditos: <span id="cred" style="color: var(--cyan-progress);">0</span>/<span id="total-cred-ui">260</span></div>
    </div>
    <div class="stats">
        <span>Progreso: <span id="porc">0%</span></span>
        <div class="progress-bar"><div id="fill" class="fill"></div></div>
    </div>
</header>

<div class="grid-reticula" id="kardex-container"></div>

<script>
    const TOTAL_CREDITOS = 260; 
    document.getElementById('total-cred-ui').textContent = TOTAL_CREDITOS;

    const data = [
        { s: 1, m: [["ACC0906",4,"FUND. INVESTIGACION"],["ACF2301",5,"CALCULO DIFERENCIAL"],["GEC2305",4,"DESARROLLO HUMANO"],["AEF1074",5,"FUND. DE GESTION"],["GEC0909",4,"FUND. DE FISICA"],["GEF0910",5,"FUND. DE QUIMICA"]] },
        { s: 2, m: [["AEB1082",5,"SOFT. APLIC. EJEC."],["ACF0902",5,"CALCULO INTEGRAL"],["GED0903",5,"CONT. ORIENTADA NEG."],["AEC1014",4,"DINAMICA SOCIAL"],["ACH2307",4,"TALLER DE ETICA"],["GEE0918",4,"LEGISLACION LABORAL"]] },
        { s: 3, m: [["AEC1078",4,"MARCO LEGAL ORGS."],["GED0921",5,"PROB. Y EST. DESC."],["GED0904",5,"COSTOS EMPRESARIALES"],["GEC0913",4,"HAB. DIRECTIVAS I"],["AEF1071",5,"ECONOMIA EMP."],["ACF0903",5,"ALGEBRA LINEAL"]] },
        { s: 4, m: [["GEF0916",5,"ING. ECONOMICA"],["GEG0907",6,"EST. INFERENCIAL I"],["GED0917",5,"INST. PRESUP. EMP."],["GEC0914",4,"HAB. DIRECTIVAS II"],["GEF0906",5,"ENT. MACROECONOMICO"],["AEF1076",5,"INV. OPERACIONES"]] },
        { s: 5, m: [["AEF1073",5,"FINANZAS ORGS"],["GEG0908",6,"EST. INFERENCIAL II"],["GEF0915",5,"ING. PROCESOS"],["AEG1075",6,"GESTION CAPITAL HUM."],["ACA0909",4,"TALLER INV. I"],["GEF0919",5,"MERCADOTECNIA"]] },
        { s: 6, m: [["GEF0901",5,"ADMIN. SAL. SEG. OC."],["AED1072",5,"EMPREND. INNOVAC."],["GEC0911",4,"GESTION PROD. I"],["AED1015",5,"DISEÑO ORG."],["ACA0910",4,"TALLER INV. II"],["GED0922",5,"SIST. INFO. MERC."],["AC0950",5,"ACTIV. COMPLEM."]] },
        { s: 7, m: [["AED1069",5,"CALIDAD G. EMP."],["GED0920",5,"PLAN NEGOCIOS"],["GEC0912",4,"GESTION PROD. II"],["AED1035",5,"GESTION ESTRATEGICA"],["ACD0908",5,"DES. SUSTENTABLE"],["AEB1045",5,"MERC. ELECTRONICA"]] },
        { s: 8, m: [["GEF0902",5,"CAD. SUMINISTROS"],["GEA0950",10,"SERVICIO SOCIAL"]] },
        { s: 9, m: [["RES1001",10,"RESIDENCIA PROF."]] }
    ];

    // Renderizar de inmediato para evitar pantallas vacías
    const container = document.getElementById('kardex-container');
    let htmlInyectar = "";
    data.forEach(sem => {
        htmlInyectar += `<div class="semestre-col" id="sem-col-${sem.s}"><div class="semestre-header">Semestre ${sem.s}</div>`;
        sem.m.forEach((mat, i) => {
            htmlInyectar += `<div class="materia-card" data-c="${mat[1]}" data-semestre="${sem.s}" id="m-${sem.s}-${i}">
                        <button class="btn-desbloquear">🔓</button>
                        <div class="materia-header">${mat[0]}</div>
                        <div class="materia-name">${mat[2]}</div>
                        <div class="materia-creditos">${mat[1]} CR</div>
                    </div>`;
        });
        htmlInyectar += `</div>`;
    });
    container.innerHTML = htmlInyectar;

    // Lógica de interacción
    document.querySelectorAll('.materia-card').forEach(card => {
        const id = card.id;
        if(localStorage.getItem(id)) card.classList.add('aprobada');
        
        card.addEventListener('click', () => {
            if(!card.classList.contains('aprobada')) {
                card.classList.add('aprobada');
                localStorage.setItem(id, '1');
                calc();
                checkLogrosEspeciales(card.dataset.semestre, true);
            }
        });
        
        card.querySelector('.btn-desbloquear').addEventListener('click', (e) => {
            e.stopPropagation();
            card.classList.remove('aprobada');
            localStorage.removeItem(id);
            localStorage.removeItem('sem_completo_' + card.dataset.semestre);
            calc();
        });
    });

    function calc() {
        let cred = 0;
        document.querySelectorAll('.materia-card.aprobada').forEach(c => cred += parseInt(c.dataset.c));
        document.getElementById('cred').textContent = cred;
        let prog = Math.round((cred/TOTAL_CREDITOS)*100);
        if (prog > 100) prog = 100;
        document.getElementById('porc').textContent = prog + '%';
        document.getElementById('fill').style.width = prog + '%';
    }

    function checkLogrosEspeciales(numSemestre, esClicEnVivo) {
        calc();
    }

    function lanzarModal(titulo, texto) {
        document.getElementById('modal-title').innerHTML = titulo;
        document.getElementById('modal-text').innerHTML = texto;
        document.getElementById('universal-overlay-container').style.display = 'flex';
    }

    function cerrarModal() {
        document.getElementById('universal-overlay-container').style.display = 'none';
    }

    // Inicializar cálculos
    calc();

    // Remover pantalla de carga de inmediato al procesar el script
    setTimeout(() => {
        const screen = document.getElementById('loading-screen');
        if(screen) {
            screen.style.display = 'none';
        }
    }, 800);
</script>
</body>
</html>
